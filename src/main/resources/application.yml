      secret: "dGhpcyBpcyBhIHNlY3VyZSBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gZ2VuZXJhdGlvbiE="
      expirationMs: 3600000 # 1 Hour

server:
  port: 8080
